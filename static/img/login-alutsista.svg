<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Login backdrop: night sky over military vehicles (tank, 6x6 APC, truck) in silhouette. -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#16345c"/>
    </linearGradient>
    <linearGradient id="cakrawala" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="siluet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3a62"/>
      <stop offset="1" stop-color="#0e2240"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#langit)"/>
  <rect y="480" width="1600" height="240" fill="url(#cakrawala)"/>

  <g fill="#cbd5e1" opacity="0.35">
    <circle cx="120" cy="90" r="1.6"/><circle cx="310" cy="160" r="1.2"/><circle cx="470" cy="70" r="1.4"/>
    <circle cx="690" cy="130" r="1"/><circle cx="860" cy="60" r="1.6"/><circle cx="1010" cy="150" r="1.2"/>
    <circle cx="1180" cy="90" r="1.4"/><circle cx="1350" cy="170" r="1"/><circle cx="1520" cy="80" r="1.6"/>
    <circle cx="220" cy="260" r="1"/><circle cx="600" cy="240" r="1.2"/><circle cx="960" cy="280" r="1"/>
    <circle cx="1280" cy="250" r="1.2"/><circle cx="1470" cy="300" r="1"/><circle cx="40" cy="330" r="1.2"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 640 Q200 560 420 610 T860 600 T1300 590 T1600 610 V900 H0 Z" fill="#0d213d" opacity="0.9"/>

  <g fill="url(#siluet)" stroke="#c9a227" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round">
    <!-- Main battle tank -->
    <rect x="180" y="630" width="470" height="74" rx="37"/>
    <path d="M200 632 L226 588 L612 588 L660 632 Z"/>
    <path d="M330 588 L352 540 L496 532 L548 552 L556 588 Z"/>
    <rect x="552" y="548" width="250" height="13" rx="4"/>
    <rect x="398" y="516" width="44" height="20" rx="4"/>
    <!-- 6x6 armoured personnel carrier -->
    <path d="M880 646 L902 568 L990 540 L1250 540 L1296 594 L1300 646 Z"/>
    <rect x="1070" y="512" width="96" height="30" rx="5"/>
    <rect x="1162" y="520" width="120" height="9" rx="3"/>
    <!-- Truck -->
    <path d="M1360 652 L1360 590 L1500 590 L1500 652 Z"/>
    <path d="M1500 652 L1500 604 L1548 604 L1572 630 L1572 652 Z"/>
  </g>

  <g fill="#081527" stroke="#c9a227" stroke-opacity="0.3" stroke-width="2">
    <!-- Tank road wheels -->
    <circle cx="236" cy="667" r="22"/><circle cx="300" cy="667" r="22"/><circle cx="364" cy="667" r="22"/>
    <circle cx="428" cy="667" r="22"/><circle cx="492" cy="667" r="22"/><circle cx="556" cy="667" r="22"/>
    <circle cx="616" cy="667" r="20"/>
    <!-- APC wheels -->
    <circle cx="950" cy="660" r="36"/><circle cx="1070" cy="660" r="36"/><circle cx="1226" cy="660" r="36"/>
    <!-- Truck wheels -->
    <circle cx="1400" cy="664" r="22"/><circle cx="1460" cy="664" r="22"/><circle cx="1546" cy="664" r="22"/>
  </g>

  <!-- Ground -->
  <rect y="690" width="1600" height="210" fill="#081527"/>
  <path d="M0 690 H1600" stroke="#c9a227" stroke-opacity="0.25" stroke-width="2"/>
</svg>
