# The Server menu's view of Podman in production: a relay in front of the
# host's Podman socket that answers the two lookups the menu makes (the
# containers and their CPU/RAM figures) and refuses everything else. The app
# talks to this, never to the socket, which would let it run, stop or remove
# any container on the host.
#
# Root inside this container is the host's user outside (rootless Podman),
# the owner of the socket: the workers need it to open the socket.
user root;
worker_processes 1;
events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 2375;

        location = /v4.0.0/libpod/containers/json {
            limit_except GET { deny all; }
            proxy_pass http://unix:/run/podman/podman.sock;
        }
        location = /v4.0.0/libpod/containers/stats {
            limit_except GET { deny all; }
            proxy_pass http://unix:/run/podman/podman.sock;
            proxy_read_timeout 10s;
        }
        location / {
            return 403;
        }
    }
}
