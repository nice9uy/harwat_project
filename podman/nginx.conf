# One worker per core, each holding many connections (the defaults are one
# worker and 512 connections).
worker_processes auto;
events {
    worker_connections 4096;
}

http {
    # Without these every static file goes out as text/plain, and browsers
    # refuse a stylesheet that isn't text/css: the pages show unstyled.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream app_backend {
        server app1:8000 max_fails=3 fail_timeout=30s;
        server app2:8000 max_fails=3 fail_timeout=30s;
        server app3:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        # Plain HTTP and, with the certificate of scripts/siapkan-tls.sh
        # (mkcert), HTTPS. Both stay open: a browser that has not imported the
        # certificate authority yet can still get in over HTTP.
        listen 8000;
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # The certificate authority to import into a browser or phone so that
        # it trusts the certificate above (public: it holds no key).
        location = /rootCA.pem {
            alias /etc/nginx/tls/rootCA.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="harwat-rootCA.pem"';
        }

        # Photo uploads: nginx's default is 1 MB. Same limit as
        # BOLT_MAX_UPLOAD_SIZE in settings.py.
        client_max_body_size 200m;

        # gzip only responses without secrets: static files and the inspection
        # checklists (up to ~1.2 MB of repetitive HTML, ~26 KB compressed).
        # Pages carrying the CSRF token stay uncompressed (BREACH).
        gzip_types text/css application/javascript image/svg+xml text/html;
        gzip_min_length 1024;
        gzip_proxied any;

        # Host goes on with its port ($http_host, not $host): Django compares
        # a POST's Origin (http://server:8000) with it, and without the port
        # every form sent from a browser is refused as a CSRF failure (403).
        location /static/ {
            gzip on;
            alias /usr/share/nginx/static/;
        }

        location /pemeriksaan/checklist/ {
            gzip on;
            proxy_pass http://app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
