events {}

http {
    upstream app_backend {
        server app1:8000 max_fails=3 fail_timeout=30s;
        server app2:8000 max_fails=3 fail_timeout=30s;
        server app3:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;

        # gzip only responses without secrets: static files and the inspection
        # checklists (up to ~1.2 MB of repetitive HTML, ~26 KB compressed).
        # Pages carrying the CSRF token stay uncompressed (BREACH).
        gzip_types text/css application/javascript image/svg+xml text/html;
        gzip_min_length 1024;
        gzip_proxied any;

        location /static/ {
            gzip on;
            alias /usr/share/nginx/static/;
        }

        location /pemeriksaan/checklist/ {
            gzip on;
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
