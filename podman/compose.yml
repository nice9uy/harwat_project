# Image names are spelled out with their registry (docker.io/...): a machine
# whose /etc/containers/registries.conf lists no unqualified-search registry
# refuses short names like "postgres:17-alpine" and starts nothing.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmn_harwat}
      POSTGRES_USER: ${POSTGRES_USER:-bmn_harwat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: docker.io/edoburu/pgbouncer
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-bmn_harwat}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-bmn_harwat}
      POOL_MODE: transaction
      # PostgreSQL 17 stores SCRAM passwords; the image's default (md5) can't
      # log in to it ("server login failed: wrong password type").
      AUTH_TYPE: scram-sha-256
      # How many app connections it accepts and how many it keeps open to
      # PostgreSQL (well under PostgreSQL's 100); sized by prod.sh in production.
      MAX_CLIENT_CONN: ${PGBOUNCER_KLIEN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL:-20}
    depends_on:
      - postgres
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    restart: unless-stopped

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Jakarta
      # No PEERS here: the image then makes no peers of its own. The app
      # writes wg0.conf from the peers in its database into the wireguard-conf
      # volume (settings.VPN_CONF_DIR) and sinkron.sh runs the server from it,
      # applying every change.
      LOG_CONFS: "false"
    volumes:
      - wireguard-config:/config
      - wireguard-conf:/vpn
      - ../podman/wireguard/sinkron.sh:/custom-services.d/sinkron:ro
      - /lib/modules:/lib/modules:ro
    ports:
      - "${VPN_PORT:-51820}:${VPN_PORT:-51820}/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

volumes:
  pgdata:
  valkey-data:
  garage-data:
  garage-meta:
  wireguard-config:
  wireguard-conf:
