services:
  app:
    build:
      context: ..
      dockerfile: Containerfile
      target: builder
    # The app-dev-venv volume outlives image rebuilds, so a dependency added to
    # uv.lock after the volume was first created would never reach it. Sync on
    # every start (a no-op when nothing changed) before launching the server.
    command: ["sh", "-c", "uv sync --frozen && exec python manage.py runbolt --dev --host 0.0.0.0 --port 8001"]
    volumes:
      - ..:/app
      - app-dev-venv:/app/.venv
      # The host's Podman API socket, for the Server menu's container list
      # (settings.PODMAN_SOCKET). Needs `systemctl --user enable --now
      # podman.socket` on the host. Whoever controls the app can control
      # Podman through it, so this is mounted in dev only.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock
      # The WireGuard server's wg0.conf (settings.VPN_CONF_DIR); only written
      # once VPN_SERVER_PRIVKEY is set in .env.dev.
      - wireguard-conf:/vpn
    environment:
      DJANGO_DEBUG: "True"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Extra hosts, e.g. the laptop's Wi-Fi IP so phones on the same network
      # can open http://<ip>:8000 (localhost stays allowed in dev).
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      VPN_CONF_DIR: /vpn
      VPN_SERVER_PRIVKEY: ${VPN_SERVER_PRIVKEY:-}
      VPN_SERVER_ENDPOINT: ${VPN_SERVER_ENDPOINT:-}
      VPN_SUBNET: ${VPN_SUBNET:-10.13.0.0/20}
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    working_dir: /app

  garage:
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ../podman/garage.dev.toml:/etc/garage.toml:ro
    command: ["/garage", "server", "--single-node", "--default-bucket"]

volumes:
  app-dev-venv:
