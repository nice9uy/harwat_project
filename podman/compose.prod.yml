services:
  app1:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  app2:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  app3:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  static-sync:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    user: "0:0"
    command: ["sh", "-c", "cp -r /app/staticfiles/. /shared/ && echo static files synced"]
    volumes:
      - static-data:/shared

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../podman/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-data:/usr/share/nginx/static:ro
    ports:
      - "8000:8000"
    depends_on:
      - app1
      - app2
      - app3
      - static-sync
    restart: unless-stopped

  garage:
    volumes:
      - ../podman/garage.prod.toml:/etc/garage.toml:ro
    command: ["/garage", "server"]

volumes:
  sqlite-data:
  static-data:
