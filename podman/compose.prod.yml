services:
  app1:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    # Worker processes per container, sized to the machine by prod.sh
    # (APP_PROSES in .env.prod); the image's own default is 4.
    command: ["python", "manage.py", "runbolt", "--host", "0.0.0.0", "--port", "8000", "--processes", "${APP_PROSES:-4}", "--respawn-failed-workers"]
    volumes:
      # The SQLite file production ran on before PostgreSQL: only read, once,
      # by `manage.py impor_sqlite` (settings.SQLITE_LAMA).
      - sqlite-data:/app/data
      # Backups made from the Backup menu, shared by the three app containers.
      - backup-data:/app/backup
      # The WireGuard server's wg0.conf, written by the app, read by the
      # wireguard container (settings.VPN_CONF_DIR).
      - wireguard-conf:/vpn
      # Photos copied out of the old containers by prod.sh, for `manage.py
      # impor_media` to put into Garage (app1 runs the one-time commands).
      - ../migrasi/media:/app/migrasi-media:ro
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  app2:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    # Worker processes per container, sized to the machine by prod.sh
    # (APP_PROSES in .env.prod); the image's own default is 4.
    command: ["python", "manage.py", "runbolt", "--host", "0.0.0.0", "--port", "8000", "--processes", "${APP_PROSES:-4}", "--respawn-failed-workers"]
    volumes:
      # The SQLite file production ran on before PostgreSQL: only read, once,
      # by `manage.py impor_sqlite` (settings.SQLITE_LAMA).
      - sqlite-data:/app/data
      # Backups made from the Backup menu, shared by the three app containers.
      - backup-data:/app/backup
      # The WireGuard server's wg0.conf, written by the app, read by the
      # wireguard container (settings.VPN_CONF_DIR).
      - wireguard-conf:/vpn
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  app3:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    env_file:
      - ../.env.prod
    # Worker processes per container, sized to the machine by prod.sh
    # (APP_PROSES in .env.prod); the image's own default is 4.
    command: ["python", "manage.py", "runbolt", "--host", "0.0.0.0", "--port", "8000", "--processes", "${APP_PROSES:-4}", "--respawn-failed-workers"]
    volumes:
      # The SQLite file production ran on before PostgreSQL: only read, once,
      # by `manage.py impor_sqlite` (settings.SQLITE_LAMA).
      - sqlite-data:/app/data
      # Backups made from the Backup menu, shared by the three app containers.
      - backup-data:/app/backup
      # The WireGuard server's wg0.conf, written by the app, read by the
      # wireguard container (settings.VPN_CONF_DIR).
      - wireguard-conf:/vpn
    depends_on:
      - postgres
      - pgbouncer
      - valkey
      - garage
    restart: unless-stopped

  static-sync:
    build:
      context: ..
      dockerfile: Containerfile
      target: final
    user: "0:0"
    command: ["sh", "-c", "cp -r /app/staticfiles/. /shared/ && echo static files synced"]
    volumes:
      - static-data:/shared

  nginx:
    image: docker.io/library/nginx:1.30-alpine
    volumes:
      - ../podman/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-data:/usr/share/nginx/static:ro
      # The HTTPS certificate and its authority (scripts/siapkan-tls.sh).
      - ../podman/tls:/etc/nginx/tls:ro
    ports:
      # The host ports: 8000 and 8443 unless .env.prod sets PORT_HTTP and
      # PORT_HTTPS (80 and 443 for addresses without a port; prod.sh checks
      # the host lets this user open them).
      - "${PORT_HTTP:-8000}:8000"
      - "${PORT_HTTPS:-8443}:8443"
    depends_on:
      - app1
      - app2
      - app3
      - static-sync
    restart: unless-stopped

  # The Server menu's read-only window on Podman (podman/podman-api.conf):
  # it holds the host's Podman socket so that the app never does. Not
  # published: only the app containers reach it, at http://podman-api:2375.
  podman-api:
    image: docker.io/library/nginx:1.30-alpine
    volumes:
      - ../podman/podman-api.conf:/etc/nginx/nginx.conf:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock
    restart: unless-stopped

  # The primary: the only database the app writes to (through pgbouncer).
  postgres:
    environment:
      REPLIKASI_USER: ${REPLIKASI_USER}
      REPLIKASI_PASSWORD: ${REPLIKASI_PASSWORD}
      # Memory and parallelism, sized to the machine by prod.sh (.env.prod).
      PG_SHARED_BUFFERS_MB: ${PG_SHARED_BUFFERS_MB:-128}
      PG_EFFECTIVE_CACHE_MB: ${PG_EFFECTIVE_CACHE_MB:-4096}
      PG_WORK_MEM_MB: ${PG_WORK_MEM_MB:-4}
      PG_MAINTENANCE_MB: ${PG_MAINTENANCE_MB:-64}
      PG_PARALEL: ${PG_PARALEL:-2}
    # Parallel queries share memory through /dev/shm (64 MB by default in a container).
    shm_size: 1gb
    command: ["sh", "/skrip/primary.sh"]
    volumes:
      - ../podman/postgres/primary.sh:/skrip/primary.sh:ro
      - ../podman/postgres/10-replikasi.sh:/docker-entrypoint-initdb.d/10-replikasi.sh:ro

  # Two read-only hot standbys following the primary by streaming replication,
  # each on a volume of its own. They copy the primary on their first start.
  postgres-replica1:
    image: docker.io/library/postgres:17-alpine
    environment: &replica-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLIKASI_USER: ${REPLIKASI_USER}
      REPLIKASI_PASSWORD: ${REPLIKASI_PASSWORD}
      PRIMARY_HOST: postgres
      # A standby only replays the primary's changes: a small cache is enough.
      PG_REPLICA_BUFFERS_MB: ${PG_REPLICA_BUFFERS_MB:-128}
    command: ["sh", "/skrip/replica.sh"]
    volumes:
      - ../podman/postgres/replica.sh:/skrip/replica.sh:ro
      - pgdata-replica1:/var/lib/postgresql/data
    depends_on:
      - postgres
    restart: unless-stopped

  postgres-replica2:
    image: docker.io/library/postgres:17-alpine
    environment: *replica-env
    command: ["sh", "/skrip/replica.sh"]
    volumes:
      - ../podman/postgres/replica.sh:/skrip/replica.sh:ro
      - pgdata-replica2:/var/lib/postgresql/data
    depends_on:
      - postgres
    restart: unless-stopped

  # Holds the uploaded photos (bucket GARAGE_DEFAULT_BUCKET, made on start
  # together with the app's access key).
  garage:
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ../podman/garage.prod.toml:/etc/garage.toml:ro
    command: ["/garage", "server", "--single-node", "--default-bucket"]

volumes:
  sqlite-data:
  static-data:
  backup-data:
  pgdata-replica1:
  pgdata-replica2:
