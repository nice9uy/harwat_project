{% comment %}
History of one vehicle (same tabs as the History menu) inside the Armada modal.
{% endcomment %}
<div x-data="{ tab: 'profile' }" class="space-y-4">
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 min-w-0">
            <button type="button"
                    hx-get="{% url 'fleet:vehicle_search' %}"
                    hx-target="#vehicle-modal-body"
                    hx-swap="innerHTML"
                    title="Kembali ke pencarian"
                    class="rounded-md p-1 text-slate-400 hover:bg-slate-100 hover:text-navy dark:hover:bg-slate-700 dark:hover:text-gold">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
            </button>
            <h2 class="truncate text-lg font-semibold text-navy dark:text-slate-100">History {{ vehicle.nopol|default:"" }}</h2>
        </div>
        <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Tutup">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
    </div>
    <nav class="flex gap-6 overflow-x-auto border-b border-slate-200 dark:border-slate-700 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        {% include "accounts/_history_tabs.html" %}
    </nav>
    <div class="max-h-[65vh] overflow-y-auto pr-1">
        {% include "accounts/_history_kendaraan.html" %}
    </div>
</div>
