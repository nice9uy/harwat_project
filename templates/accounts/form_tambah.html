{% extends "base.html" %}
{% block title %}Form Tambah — BMN Harwat{% endblock %}
{% block page_title %}Form Tambah{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data"
      x-data="{
          step: 1,
          fotoPreview: null,
          next() {
              for (const el of $refs.biodata.querySelectorAll('input, select, textarea')) {
                  if (!el.reportValidity()) return;
              }
              this.step = 2;
          },
      }">
    <div class="border-b border-slate-200 dark:border-slate-700 mb-4">
        <nav class="flex gap-6 -mb-px">
            <button type="button" @click="step = 1"
                    :class="step === 1 ? 'border-gold text-navy dark:text-gold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'"
                    class="inline-flex items-center gap-2 border-b-2 px-1 py-2 text-sm font-medium">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0" />
                </svg>
                BIODATA
            </button>
            <button type="button" @click="next()"
                    :class="step === 2 ? 'border-gold text-navy dark:text-gold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'"
                    class="inline-flex items-center gap-2 border-b-2 px-1 py-2 text-sm font-medium">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 16V6.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V16M2.5 16h11M2.5 16v-2.5M13.5 16v-4.5h3.5l3 3V16h-3" />
                    <circle cx="6" cy="18" r="1.5" />
                    <circle cx="16.5" cy="18" r="1.5" />
                </svg>
                TAMBAH KENDARAAN
            </button>
        </nav>
    </div>
    {% csrf_token %}
    <div x-ref="biodata" x-show="step === 1" class="max-w-md mx-auto space-y-4">
    {% include "accounts/_biodata_fields.html" %}
    <button type="button" @click="next()" class="w-full rounded-md bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-gold/50">
        Lanjut
    </button>
    </div>
    <div x-show="step === 2" x-cloak class="max-w-md mx-auto space-y-4">
        <label class="flex items-center gap-3 rounded-md border border-slate-300 dark:border-slate-600 px-3 py-3 text-sm text-slate-700 dark:text-slate-200 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
            <input type="radio" name="golongan" value="B" required x-ref="golongan" class="h-4 w-4 border-slate-300 text-navy accent-gold focus:ring-gold dark:border-slate-600 dark:bg-slate-900">
            Golongan "B"
        </label>
        <button type="button" @click="$refs.golongan.reportValidity()" class="w-full rounded-md bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-gold/50">
            Lanjut
        </button>
    </div>
</form>
{% endblock %}
