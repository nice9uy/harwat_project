<div class="mb-3 flex items-center gap-3">
    {% include "_ikon_dialog.html" with jenis="kunci" %}
    <h2 class="text-lg font-semibold text-navy dark:text-slate-100">Reset Password</h2>
</div>
<p class="text-sm text-slate-600 dark:text-slate-300">
    Reset password user <span class="font-semibold text-navy dark:text-slate-100">{{ akun.username }}</span> ({{ keanggotaan }})?
    Password lamanya tidak berlaku lagi.
</p>
<p class="mt-3 rounded-md bg-slate-100 dark:bg-slate-900 px-3 py-2 text-xs text-slate-600 dark:text-slate-300">Password setelah reset: <span class="font-mono font-semibold">{{ password }}</span></p>
<form method="post" action="{% url 'accounts:user_reset_password' akun.publik.uuid %}" class="flex items-center justify-end gap-3 pt-4">
    {% csrf_token %}
    <button type="button" @click="modalOpen = false" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Batal</button>
    <button type="submit" class="rounded-md bg-amber-600 px-4 py-2 text-sm font-medium text-white hover:bg-amber-700">Reset Password</button>
</form>
