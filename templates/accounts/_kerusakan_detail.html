{# Damage recorded for an inspection item: kondisi, jumlah, keterangan, foto. #}
<dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
    <dt class="text-slate-500 dark:text-slate-400">Kondisi</dt>
    <dd>{{ item.get_kondisi_display }}</dd>
    <dt class="text-slate-500 dark:text-slate-400">Jumlah</dt>
    <dd>{{ item.jumlah|default_if_none:"-" }}</dd>
    <dt class="text-slate-500 dark:text-slate-400">Keterangan</dt>
    <dd class="whitespace-pre-line">{{ item.keterangan|default:"-" }}</dd>
</dl>
{% if item.foto %}
<a href="{{ item.foto.url }}" target="_blank" rel="noopener" class="block">
    <img src="{{ item.foto.url }}" loading="lazy" alt="Foto kerusakan {{ item.nama_alat }}" class="max-h-64 w-full rounded-md border border-slate-200 dark:border-slate-700 object-contain bg-slate-100 dark:bg-slate-900">
</a>
{% else %}
<p class="text-slate-500 dark:text-slate-400">Tidak ada foto.</p>
{% endif %}
