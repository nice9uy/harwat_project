<h2 class="text-lg font-semibold text-navy dark:text-slate-100 mb-1">Form yang Bisa Diakses</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mb-4">
    {% if ketua %}Ketua Tim{% else %}Anggota{% endif %} <span class="font-semibold text-navy dark:text-slate-100">{{ akun.username }}</span>{% if ketua and jumlah %} · berlaku juga untuk {{ jumlah }} anggotanya{% endif %}
</p>
<ul class="space-y-2">
    {% for kode, label in form %}
    <li class="rounded-md border border-slate-300 dark:border-slate-600 px-3 py-3 text-sm text-slate-700 dark:text-slate-200">{{ label }}</li>
    {% empty %}
    <li class="py-6 text-center text-sm text-slate-400 dark:text-slate-500">Belum ada form.</li>
    {% endfor %}
</ul>
<div class="flex items-center justify-end pt-4">
    <button type="button" @click="modalOpen = false" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Tutup</button>
</div>
