{# History tab buttons; the parent x-data holds `tab`. #}
<button type="button" @click="tab = 'profile'"

        class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap border-b-2 px-1 py-2 text-sm font-medium">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 16V6.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V16M2.5 16h11M2.5 16v-2.5M13.5 16v-4.5h3.5l3 3V16h-3" /><circle cx="6" cy="18" r="1.5" /><circle cx="16.5" cy="18" r="1.5" /></svg>
    PROFILE
</button>
