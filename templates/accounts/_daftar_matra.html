<div class="flex items-center justify-between mb-1">
    <h2 class="text-lg font-semibold text-navy dark:text-slate-100">Daftar sebagai Ketua Tim</h2>
    <button type="button" @click="daftarOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Tutup">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
    </button>
</div>
<p class="mb-4 text-sm text-slate-500 dark:text-slate-400">Pilih matra Anda.</p>
<div class="grid gap-3">
    {% for kode, label in matra_pilihan %}
    <button type="button"
            hx-get="{% url 'accounts:daftar_form' %}?matra={{ kode }}"
            hx-target="#daftar-modal-body"
            hx-swap="innerHTML"
            class="w-full rounded-md border border-slate-300 px-4 py-3 text-left text-sm font-medium text-navy hover:border-gold hover:bg-slate-50 dark:border-slate-600 dark:text-slate-100 dark:hover:bg-slate-700">
        {{ label }}
    </button>
    {% endfor %}
</div>
