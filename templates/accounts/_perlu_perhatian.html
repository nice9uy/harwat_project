{% load pemeriksaan_tags %}
{# Accordion of the parts not rated Baik (perlu_perhatian) with their damage details. #}
<div x-data="{ buka: null }" class="divide-y divide-slate-100 dark:divide-slate-700 rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 overflow-hidden">
    {% for item in perlu_perhatian %}
    <section>
        <button type="button" @click="buka = buka === {{ item.nomor }} ? null : {{ item.nomor }}"
                :aria-expanded="buka === {{ item.nomor }}"
                class="w-full flex items-center justify-between gap-3 px-4 py-2.5 text-left text-sm hover:bg-slate-50 dark:hover:bg-slate-700/50">
            <span class="font-medium text-navy dark:text-slate-100">{{ item.nomor }}. {{ item.nama_alat }}</span>
            <span class="flex shrink-0 items-center gap-2">
                <span class="rounded px-1.5 py-0.5 text-xs font-semibold text-white {{ item.kondisi|kondisi_warna }}" title="{{ item.get_kondisi_display }}">{{ item.kondisi }}</span>
                <svg :class="buka === {{ item.nomor }} && 'rotate-180'" class="h-4 w-4 text-slate-400 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
            </span>
        </button>
        <div x-show="buka === {{ item.nomor }}" x-cloak class="px-4 pb-4 pt-1 space-y-3 text-sm">
            {% include "accounts/_kerusakan_detail.html" %}
        </div>
    </section>
    {% empty %}
    <p class="px-4 py-4 text-center text-sm text-slate-500 dark:text-slate-400">Semua item dalam kondisi baik.</p>
    {% endfor %}
</div>
