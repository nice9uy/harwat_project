<h2 class="text-lg font-semibold text-navy dark:text-slate-100 mb-2">Hapus Anggota</h2>
<p class="text-sm text-slate-600 dark:text-slate-300">
    Yakin ingin menghapus <span class="font-semibold text-navy dark:text-slate-100">{{ target.username }}</span> ({{ keanggotaan }})?
    Akun dan VPN-nya dihapus: user ini tidak akan bisa login lagi dan tindakan ini tidak bisa dibatalkan.
</p>
<div x-data="{ input: '' }" class="pt-4 space-y-3">
    <div class="flex items-center justify-center rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 py-3">
        <span class="font-mono text-3xl font-bold tracking-[0.4em] text-navy dark:text-slate-100 select-none">{{ captcha_kode }}</span>
    </div>
    <div>
        <label class="block text-sm text-slate-600 dark:text-slate-300 mb-1">Masukkan kode di atas untuk konfirmasi:</label>
        <input type="text" x-model="input" autocomplete="off" inputmode="numeric" maxlength="6" spellcheck="false"
               class="w-full rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-center font-mono tracking-widest text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-red-500/50">
    </div>
    <form method="post" action="{% url 'accounts:anggota_tim_vpn_hapus' target.publik.uuid %}" class="flex items-center justify-end gap-3">
        {% csrf_token %}
        <input type="hidden" name="captcha" :value="input">
        <button type="button" @click="modalOpen = false" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Batal</button>
        <button type="submit"
                :disabled="input.length !== 6"
                :class="input.length === 6 ? 'bg-red-600 hover:bg-red-700 cursor-pointer' : 'bg-red-300 dark:bg-red-900/50 cursor-not-allowed'"
                class="rounded-md px-4 py-2 text-sm font-medium text-white transition-colors">Hapus</button>
    </form>
</div>
