{% extends "base.html" %}
{% block title %}Perbaikan — BMN Harwat{% endblock %}
{% block page_title %}Perbaikan{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data"
      x-data="{
          step: 1,
          fotoPreview: null,
          next() {
              for (const el of $refs.biodata.querySelectorAll('input, select, textarea')) {
                  if (!el.reportValidity()) return;
              }
              this.step = 2;
          },
      }">
    <div class="sticky top-16 z-20 -mx-4 px-4 sm:-mx-6 sm:px-6 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 mb-4">
        <nav class="flex gap-6 -mb-px">
            <button type="button" @click="step = 1"
                    :class="step === 1 ? 'border-gold text-navy dark:text-gold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'"
                    class="inline-flex items-center gap-2 border-b-2 px-1 py-2 text-sm font-medium">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0" />
                </svg>
                BIODATA
            </button>
            <button type="button" @click="next()"
                    :class="step === 2 ? 'border-gold text-navy dark:text-gold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'"
                    class="inline-flex items-center gap-2 border-b-2 px-1 py-2 text-sm font-medium">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
                </svg>
                PERBAIKAN
            </button>
        </nav>
    </div>
    {% csrf_token %}
    <div x-ref="biodata" x-show="step === 1" class="max-w-md mx-auto space-y-4">
    {% include "accounts/_biodata_fields.html" %}
    <button type="button" @click="next()" class="w-full rounded-md bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-gold/50">
        Lanjut
    </button>
    </div>
    <div x-show="step === 2" x-cloak class="max-w-md mx-auto space-y-4">
    </div>
</form>
{% endblock %}
