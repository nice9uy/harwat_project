<div class="mb-3 flex items-center gap-3">
    {% include "_ikon_dialog.html" with jenis="hapus" %}
    <h2 class="text-lg font-semibold text-navy dark:text-slate-100">Hapus {{ barang.get_group_display }}</h2>
</div>
<p class="text-sm text-slate-600 dark:text-slate-300">
    Yakin ingin menghapus <span class="font-semibold text-navy dark:text-slate-100">{{ barang.nama_barang }}</span>{% if barang.kode_barang %} ({{ barang.kode_barang }}){% endif %}? Tindakan ini tidak bisa dibatalkan.
</p>
<form method="post" action="{% url 'accounts:non_kendaraan_delete' barang.uuid %}" class="flex items-center justify-end gap-3 pt-4">
    {% csrf_token %}
    <button type="button" @click="modalOpen = false" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Batal</button>
    <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Hapus</button>
</form>
