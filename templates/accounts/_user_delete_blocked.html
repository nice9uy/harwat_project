<div class="mb-3 flex items-center gap-3">
    {% include "_ikon_dialog.html" with jenis="blokir" %}
    <h2 class="text-lg font-semibold text-navy dark:text-slate-100">Hapus User</h2>
</div>
<p class="text-sm text-slate-600 dark:text-slate-300">
    User <span class="font-semibold text-navy dark:text-slate-100">{{ akun.username }}</span> ({{ keanggotaan }}) belum bisa dihapus.
</p>
<div class="mt-3 rounded-md bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 px-3 py-2 text-sm text-red-700 dark:text-red-300">
    {{ pesan }}
</div>
<div class="flex items-center justify-end pt-4">
    <button type="button" @click="modalOpen = false" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Tutup</button>
</div>
