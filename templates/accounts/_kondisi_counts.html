{% load pemeriksaan_tags %}
<div class="flex shrink-0 flex-wrap justify-end gap-1 text-xs font-semibold text-white">
    {% for kode, label, jumlah in hasil.kondisi_counts %}
    <span class="rounded {{ kode|kondisi_warna }} px-1.5 py-0.5" title="{{ label }}">{{ kode }} {{ jumlah }}</span>
    {% endfor %}
</div>
