{% load static %}
<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BMN Harwat{% endblock %}</title>
    {% include "_theme_init.html" %}
    <link rel="stylesheet" href="{% static 'dist/output.css' %}">
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpinejs.min.js' %}" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100" x-data="{ sidebarOpen: false }">
    <div class="flex min-h-screen">
        <div x-show="sidebarOpen"
             x-cloak
             @click="sidebarOpen = false"
             class="fixed inset-0 z-40 bg-black/50 md:hidden"></div>

        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
               class="fixed inset-y-0 left-0 z-50 w-64 shrink-0 bg-navy text-slate-100 flex flex-col transition-transform duration-200 ease-in-out md:static md:translate-x-0 md:flex">
            <div class="px-6 py-5 flex items-center justify-between border-b border-white/10">
                <span class="text-lg font-semibold tracking-wide">BMN Harwat</span>
                <button type="button" @click="sidebarOpen = false" class="md:hidden text-slate-300 hover:text-white p-1" aria-label="Tutup menu">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 text-sm" @click="sidebarOpen = false">
                <a href="{% url 'accounts:dashboard' %}" class="flex items-center gap-2 rounded-md px-3 py-2 {% if request.resolver_match.namespace == 'accounts' %}bg-white/10 text-gold font-medium{% else %}text-slate-200 hover:bg-white/5{% endif %}">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" />
                        <rect x="13" y="3" width="8" height="8" rx="1.5" />
                        <rect x="3" y="13" width="8" height="8" rx="1.5" />
                        <rect x="13" y="13" width="8" height="8" rx="1.5" />
                    </svg>
                    Dashboard
                </a>
                <a href="{% url 'fleet:vehicle_list' %}" class="flex items-center gap-2 rounded-md px-3 py-2 {% if request.resolver_match.namespace == 'fleet' %}bg-white/10 text-gold font-medium{% else %}text-slate-200 hover:bg-white/5{% endif %}">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 16V6.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V16M2.5 16h11M2.5 16v-2.5M13.5 16v-4.5h3.5l3 3V16h-3" />
                        <circle cx="6" cy="18" r="1.5" />
                        <circle cx="16.5" cy="18" r="1.5" />
                    </svg>
                    Armada
                </a>
                <a href="#" class="flex items-center gap-2 rounded-md px-3 py-2 text-slate-200 hover:bg-white/5">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <rect x="3.75" y="5" width="16.5" height="15" rx="1.5" />
                        <path stroke-linecap="round" d="M7 3v3.5M17 3v3.5M3.75 9.5h16.5" />
                    </svg>
                    Jadwal
                </a>
                <a href="#" class="flex items-center gap-2 rounded-md px-3 py-2 text-slate-200 hover:bg-white/5">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.5 3.5a3.5 3.5 0 0 0-4.6 4.6L4 14v3h3l6-6a3.5 3.5 0 0 0 4.6-4.6l-2.2 2.2-2-2 2.1-2.1Z" />
                    </svg>
                    Servis
                </a>
                <a href="#" class="flex items-center gap-2 rounded-md px-3 py-2 text-slate-200 hover:bg-white/5">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.75h7.5L19 8.25V19a1.25 1.25 0 0 1-1.25 1.25H7A1.25 1.25 0 0 1 5.75 19V5A1.25 1.25 0 0 1 7 3.75Z" />
                        <path stroke-linecap="round" d="M14 3.75V8h4.5M9 12.5h6M9 15.5h6M9 9.5h2" />
                    </svg>
                    Laporan
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 flex items-center justify-between gap-3 px-4 sm:px-6 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                <div class="flex items-center gap-3 min-w-0">
                    <button type="button" @click="sidebarOpen = true" class="md:hidden shrink-0 text-slate-500 dark:text-slate-400 hover:text-navy dark:hover:text-gold p-1" aria-label="Buka menu">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <h1 class="text-base font-semibold truncate">{% block page_title %}{% endblock %}</h1>
                </div>
                <div class="flex items-center gap-2 sm:gap-3 text-sm shrink-0">
                    {% include "_theme_toggle.html" %}
                    <span class="hidden sm:inline">{{ request.user.get_username }}</span>
                    <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-slate-500 hover:text-navy dark:text-slate-400 dark:hover:text-gold">Keluar</button>
                    </form>
                </div>
            </header>
            <main class="flex-1 p-4 sm:p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
