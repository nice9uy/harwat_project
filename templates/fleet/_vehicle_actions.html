<button type="button"
        @click="modalOpen = true"
        hx-get="{% url 'fleet:vehicle_update' vehicle.pk %}"
        hx-target="#vehicle-modal-body"
        hx-swap="innerHTML"
        class="text-navy dark:text-slate-300 hover:text-gold">
    Edit
</button>
<button type="button"
        @click="modalOpen = true"
        hx-get="{% url 'fleet:vehicle_delete_confirm' vehicle.pk %}"
        hx-target="#vehicle-modal-body"
        hx-swap="innerHTML"
        class="text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300">
    Hapus
</button>
