{% if vehicle.fotos.all %}
<button type="button"
        @click="modalOpen = true"
        hx-get="{% url 'fleet:vehicle_photos' vehicle.pk %}"
        hx-target="#vehicle-modal-body"
        hx-swap="innerHTML"
        class="rounded-md border border-slate-300 dark:border-slate-600 px-3 py-1.5 text-sm font-medium text-navy dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
    Lihat ({{ vehicle.fotos.all|length }})
</button>
{% else %}-{% endif %}
