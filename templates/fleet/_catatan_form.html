<h2 class="text-lg font-semibold text-navy dark:text-slate-100 mb-4">{% if obj %}Edit{% else %}Tambah{% endif %} {{ judul }}</h2>
<form method="post" hx-post="{{ post_url }}" hx-target="this" hx-swap="outerHTML" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
            {{ field.label }}{% if not field.field.required %} <span class="font-normal text-slate-500 dark:text-slate-400">(opsional)</span>{% endif %}
        </label>
        {{ field }}
        {% if field.errors %}<p class="text-xs text-red-600 dark:text-red-400 mt-1">{{ field.errors.0 }}</p>{% endif %}
    </div>
    {% endfor %}
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="rounded-md bg-navy px-4 py-2 text-sm font-medium text-white hover:bg-navy-light focus:outline-none focus:ring-2 focus:ring-gold/50">Simpan</button>
        <button type="button" @click="modalOpen = false" class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Batal</button>
    </div>
</form>
