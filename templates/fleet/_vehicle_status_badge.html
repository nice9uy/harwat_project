{% if vehicle.status == "siap_pakai" %}
<span class="inline-flex items-center rounded-full bg-green-100 dark:bg-green-900/50 px-2 py-0.5 text-xs font-medium text-green-700 dark:text-green-300">{{ vehicle.get_status_display }}</span>
{% elif vehicle.status == "dalam_perbaikan" %}
<span class="inline-flex items-center rounded-full bg-amber-100 dark:bg-amber-900/50 px-2 py-0.5 text-xs font-medium text-amber-700 dark:text-amber-300">{{ vehicle.get_status_display }}</span>
{% elif vehicle.status == "sudah_diperbaiki" %}
<span class="inline-flex items-center rounded-full bg-sky-100 dark:bg-sky-900/50 px-2 py-0.5 text-xs font-medium text-sky-700 dark:text-sky-300">{{ vehicle.get_status_display }}</span>
{% else %}
<span class="inline-flex items-center rounded-full bg-red-100 dark:bg-red-900/50 px-2 py-0.5 text-xs font-medium text-red-700 dark:text-red-300">{{ vehicle.get_status_display }}</span>
{% endif %}
