<div class="flex items-center justify-between gap-3 mb-4">
    <h2 class="text-lg font-semibold text-navy dark:text-slate-100">Cari Kendaraan</h2>
    <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Tutup">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
    </button>
</div>
<p class="mb-2 text-xs text-slate-500 dark:text-slate-400">Klik baris kendaraan untuk melihat history-nya.</p>
<div class="relative mb-3">
    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
    <input type="search" name="q" value="{{ q }}" autofocus autocomplete="off"
           placeholder="Cari No. Registrasi, Merk/Type, No. Chasis atau No. Mesin"
           hx-get="{% url 'fleet:vehicle_search' %}?hasil=1"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#vehicle-search-rows"
           hx-swap="innerHTML"
           class="w-full rounded-md border border-slate-300 bg-white py-2 pl-9 pr-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-gold focus:outline-none focus:ring-2 focus:ring-gold/40 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500">
</div>
<div class="max-h-[60vh] overflow-auto rounded-md border border-slate-200 dark:border-slate-700">
    <table class="w-full text-sm text-left">
        <thead class="sticky top-0 bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
            <tr>
                <th class="py-2 px-3 font-medium w-10">No</th>
                <th class="py-2 px-3 font-medium">No. Registrasi</th>
                <th class="py-2 px-3 font-medium">Merk/ Type</th>
                <th class="py-2 px-3 font-medium">No. Chasis</th>
                <th class="py-2 px-3 font-medium">No. Mesin</th>
                <th class="py-2 px-3 font-medium">Golongan</th>
            </tr>
        </thead>
        <tbody id="vehicle-search-rows" class="divide-y divide-slate-100 dark:divide-slate-700">
            {% include "fleet/_vehicle_search_rows.html" %}
        </tbody>
    </table>
</div>
